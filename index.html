<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>121 AI Coach &mdash; Financial Planning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1725;
  --navy:#0E2740;
  --navy-2:#153453;
  --gold:#C9A24B;
  --gold-soft:#E4C989;
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --surface-2:#F7F9FC;
  --text:#132434;
  --muted:#657789;
  --line:#DFE5ED;
  --line-soft:#EDF1F6;
  --ok:#17845B;
  --warn:#C2571B;
  --bad:#C0392B;
  --accent:#1F4FA6;
  --accent-dk:#143A7C;
  --accent-soft:#E9EFFB;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,35,56,.06),0 2px 6px rgba(16,35,56,.05);
  --shadow:0 2px 6px rgba(16,35,56,.07),0 12px 28px rgba(16,35,56,.09);
  --shadow-lg:0 8px 24px rgba(16,35,56,.12),0 24px 60px rgba(16,35,56,.14);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sidebar-w:264px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1200px 640px at 15% -8%,#FFFFFF 0%,rgba(255,255,255,0) 62%),
    radial-gradient(900px 520px at 108% 4%,#E6ECF5 0%,rgba(230,236,245,0) 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:linear-gradient(175deg,#0E2740 0%,#0A1B2E 55%,#081625 100%);
  color:#E7EDF5;position:fixed;top:0;bottom:0;left:0;z-index:60;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  border-right:1px solid rgba(255,255,255,.07);
}
.brand{
  padding:26px 20px 20px;border-bottom:1px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(201,162,75,.13),transparent 68%)
}
.brand img{
  height:118px;width:auto;display:block;margin:0 auto;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.30))
}
.brand .tag{display:none}   /* the tagline is part of the logo artwork itself */
.nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
.nav-group{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7B90A8;
  padding:16px 12px 7px;font-weight:700
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;margin:1px 0;border-radius:9px;border:0;cursor:pointer;
  background:transparent;color:#C8D6E6;font-size:13.5px;font-weight:500;
  transition:background .16s,color .16s;line-height:1.3
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(201,162,75,.16);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--gold)}
.nav-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:currentColor;opacity:.75}
.nav-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px;color:#7B90A8;line-height:1.55}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.page{display:none;animation:fade .32s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}html{scroll-behavior:auto}}

/* ---------- Hero header ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,var(--accent-dk) 0%,var(--accent) 62%,var(--accent) 100%);
  padding:26px 34px 30px;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(1100px 300px at 88% -40%,rgba(255,255,255,.20),transparent 62%);
  pointer-events:none
}
.hero-art{position:absolute;right:20px;top:50%;transform:translateY(-50%);opacity:.26;pointer-events:none}
.hero-art svg{display:block;height:132px;width:auto}
.hero-inner{position:relative;z-index:2;max-width:760px}
.crumb{
  display:flex;align-items:center;gap:13px;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(255,255,255,.78);font-weight:600;margin-bottom:11px
}
.crumb img{height:44px;width:auto;opacity:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.32))}
.hero h1{
  font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;
  margin:0 0 7px;letter-spacing:-.015em
}
.hero p{margin:0;font-size:14px;color:rgba(255,255,255,.86);max-width:58ch;line-height:1.55}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:16px
}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 13px;
  font-size:12px;font-weight:500;color:#fff;backdrop-filter:blur(3px)
}
.chip b{font-weight:700}

/* ---------- Content ---------- */
.wrap{padding:26px 34px 70px;max-width:1220px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden;transition:box-shadow .2s
}
.card:hover{box-shadow:var(--shadow)}
.card-h{
  padding:15px 20px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(180deg,#fff,var(--surface-2))
}
.card-h h2{
  font-family:var(--serif);font-size:16.5px;font-weight:600;margin:0;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px
}
.card-h h2::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--accent)}
.card-h .sub{font-size:12.5px;color:var(--muted);margin:3px 0 0 14px;font-weight:400}
.card-b{padding:20px}
.card-b.tight{padding:6px 20px 16px}

.grid{display:grid;gap:14px 20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- Fields ---------- */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:#33475B;line-height:1.35}
.f .hint{font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.4}
.inp{
  display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);transition:border-color .15s,box-shadow .15s;overflow:hidden
}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}
.inp .pre,.inp .suf{
  padding:0 10px;font-size:12.5px;color:var(--muted);font-weight:600;
  background:var(--surface-2);align-self:stretch;display:flex;align-items:center;white-space:nowrap
}
.inp .pre{border-right:1px solid var(--line)}
.inp .suf{border-left:1px solid var(--line)}
.inp input,.inp select{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  padding:9px 11px;font-size:14px;font-family:var(--sans);color:var(--text);font-weight:500
}
.inp input[type=number]{-moz-appearance:textfield}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp select{cursor:pointer;padding-right:8px}
.inp.ro{background:var(--surface-2);border-style:dashed}
.inp.ro input{color:#2C3E50;font-weight:700;cursor:default}

/* slider */
.sld{display:flex;align-items:center;gap:12px;margin-top:2px}
.sld input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--accent) var(--pct,40%),var(--line) var(--pct,40%));
  outline:0;cursor:pointer
}
.sld input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;
  background:#fff;border:2.5px solid var(--accent);cursor:pointer;
  box-shadow:0 1px 5px rgba(16,35,56,.26);transition:transform .12s
}
.sld input[type=range]::-webkit-slider-thumb:active{transform:scale(1.14)}
.sld input[type=range]::-moz-range-thumb{
  width:19px;height:19px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);
  cursor:pointer;box-shadow:0 1px 5px rgba(16,35,56,.26)
}

/* ---------- Metrics ---------- */
.mets{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.met{
  background:linear-gradient(165deg,#fff,var(--surface-2));border:1px solid var(--line);
  border-radius:var(--radius);padding:15px 17px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm)
}
.met::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--accent)}
.met .k{
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:7px;line-height:1.35
}
.met .v{
  font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);
  line-height:1.1;letter-spacing:-.02em;word-break:break-word
}
.met .n{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.met.hero-met{background:linear-gradient(160deg,var(--accent-dk),var(--accent));border-color:transparent}
.met.hero-met::before{background:var(--gold)}
.met.hero-met .k{color:rgba(255,255,255,.78)}
.met.hero-met .v{color:#fff}
.met.hero-met .n{color:rgba(255,255,255,.8)}
.met.good::before{background:var(--ok)} .met.good .v{color:var(--ok)}
.met.bad::before{background:var(--bad)} .met.bad .v{color:var(--bad)}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1.5px solid var(--line);
  background:var(--surface-2);white-space:nowrap
}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.total td{font-weight:700;background:var(--surface-2);border-top:1.5px solid var(--line);color:var(--ink)}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td .inp{max-width:190px;margin-left:auto}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- Charts ---------- */
.chart-row{display:grid;gap:20px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:center}
@media(max-width:860px){.chart-row{grid-template-columns:1fr}}
.legend{display:flex;flex-direction:column;gap:10px}
.lg{display:flex;align-items:center;gap:10px;font-size:13px}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
.lg .lb{color:var(--muted);flex:1}
.lg .vl{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 17px;border-radius:9px;border:1.5px solid transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s;
  text-decoration:none;line-height:1.2
}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
.btn-p:hover{background:var(--accent-dk);box-shadow:var(--shadow)}
.btn-g{background:linear-gradient(140deg,#D4AF5F,#B88C36);color:#20170A;box-shadow:var(--shadow-sm)}
.btn-g:hover{box-shadow:var(--shadow)}
.btn-o{background:#fff;border-color:var(--line);color:var(--text)}
.btn-o:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Misc ---------- */
.note{
  background:var(--surface-2);border-left:3px solid var(--line);border-radius:0 8px 8px 0;
  padding:11px 15px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:6px
}
.note b{color:var(--text)}
.note ol,.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:3px 0}
.pill{
  display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.03em
}
.pill-in{background:var(--accent-soft);color:var(--accent-dk)}
.pill-ca{background:#EFF3F7;color:var(--muted)}
.sec-title{
  font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);
  margin:20px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px
}
.sec-title:first-child{margin-top:0}
.sec-title .ix{
  width:21px;height:21px;border-radius:6px;background:var(--accent-soft);color:var(--accent-dk);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  font-family:var(--sans);flex:0 0 21px
}
.hl{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.hl:last-child{border-bottom:0}
.hl .l{font-size:13.5px;color:#3B4F63}
.hl .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.pos{color:var(--ok)}

/* export bar */
.exbar{
  position:sticky;bottom:0;z-index:40;background:rgba(255,255,255,.93);
  backdrop-filter:blur(9px);border-top:1px solid var(--line);
  padding:11px 34px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-wrap:wrap;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px))
}
.exbar .t{font-size:12.5px;color:var(--muted)}
.exbar .t b{color:var(--text)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);z-index:200;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;
  box-shadow:var(--shadow-lg);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  max-width:min(92vw,460px);display:flex;align-items:center;gap:10px;font-weight:500
}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--ok)}

/* mobile nav */
.mtop{
  display:none;position:sticky;top:0;z-index:70;background:var(--navy);color:#fff;
  padding:10px 14px;align-items:center;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px))
}
.mtop img{height:44px}
.burger{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:16px;line-height:1}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,20,34,.55);z-index:55}
.scrim.show{display:block}
@media(max-width:980px){
  .sidebar{transform:translateX(-100%);transition:transform .26s ease}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .mtop{display:flex}
  .wrap{padding:20px 16px 60px}
  .hero{padding:20px 16px 24px}
  .hero h1{font-size:23px}
  .hero-art{display:none}
  .exbar{padding-left:16px;padding-right:16px}
}
@media print{
  .sidebar,.exbar,.mtop,.scrim,.no-print{display:none!important}
  .main{margin-left:0}
  .page{display:none!important}
  .page.active{display:block!important}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <img id="brandLogo" alt="121 AI Coach">
    <div class="tag">Wealth Made Easy</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="nav-foot">
    Data stays in your browser.<br>Export anytime to Excel or PDF.
  </div>
</aside>

<div class="main">
  <div class="mtop">
    <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
    <img id="mLogo" alt="121 AI Coach">
  </div>
  <div id="pages"></div>
  <div class="exbar no-print">
    <div class="t">Plan for <b id="exName">&mdash;</b> &middot; <span id="exDate">&mdash;</span></div>
    <div class="btn-row">
      <button class="btn btn-o" id="btnReset">Reset</button>
      <button class="btn btn-p" id="btnXlsx">Download Excel</button>
      <button class="btn btn-g" id="btnPdf">Download PDF</button>
    </div>
  </div>
</div>

/* =====================================================================
   121 AI COACH — FINANCIAL PLANNING STUDIO
   Finance engine mirrors Excel's FV / PV / PMT exactly.
   ===================================================================== */
(function(){
'use strict';

/* ---------- Excel-equivalent financial functions ---------- */
// FV(rate, nper, pmt, pv, type) — Excel semantics
function FV(rate, nper, pmt, pv, type){
  pmt = pmt||0; pv = pv||0; type = type||0;
  if(!isFinite(rate)||!isFinite(nper)) return 0;
  if(rate === 0) return -(pv + pmt*nper);
  var f = Math.pow(1+rate, nper);
  return -(pv*f + pmt*(1+rate*type)*(f-1)/rate);
}
// PV(rate, nper, pmt, fv, type)
function PV(rate, nper, pmt, fv, type){
  pmt = pmt||0; fv = fv||0; type = type||0;
  if(!isFinite(rate)||!isFinite(nper)) return 0;
  if(rate === 0) return -(fv + pmt*nper);
  var f = Math.pow(1+rate, nper);
  return -(fv + pmt*(1+rate*type)*(f-1)/rate)/f;
}
// PMT(rate, nper, pv, fv, type)
function PMT(rate, nper, pv, fv, type){
  pv = pv||0; fv = fv||0; type = type||0;
  if(!isFinite(nper) || nper === 0) return 0;
  if(rate === 0) return -(pv+fv)/nper;
  var f = Math.pow(1+rate, nper);
  return -(pv*f + fv)*rate/((1+rate*type)*(f-1));
}
var N = function(v){ v = parseFloat(v); return isFinite(v) ? v : 0; };

/* ---------- Formatting ---------- */
function inr(n){                       // Indian digit grouping
  if(!isFinite(n)) return '0';
  var neg = n < 0; n = Math.round(Math.abs(n));
  var s = String(n), r;
  if(s.length > 3){
    var last3 = s.slice(-3), rest = s.slice(0, -3);
    rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    r = rest + ',' + last3;
  } else r = s;
  return (neg ? '-' : '') + r;
}
function money(n){ return '\u20B9' + inr(n); }
function compact(n){                   // ₹1.19 Cr / ₹4.55 L
  if(!isFinite(n)) return '\u20B90';
  var neg = n<0, a = Math.abs(n), s;
  if(a >= 1e7)      s = (a/1e7).toFixed(2).replace(/\.00$/,'') + ' Cr';
  else if(a >= 1e5) s = (a/1e5).toFixed(2).replace(/\.00$/,'') + ' L';
  else if(a >= 1e3) s = (a/1e3).toFixed(1).replace(/\.0$/,'') + ' K';
  else              s = String(Math.round(a));
  return (neg?'-':'') + '\u20B9' + s;
}
function pctS(n){ return (Math.round(n*10)/10).toFixed(1) + '%'; }

/* ---------- Default state ---------- */
function defaults(){
  return {

      curAge:35, retAge:58, retLife:25,

      c1Age:8,  c1Edu:18, c1Mar:26,
      c2Age:0,  c2Edu:0,  c2Mar:0,
      estate:10000000
    },
    exp:{
      loans:{ house1:0, house2:0, house3:0, house4:0, personal:0, car1:0, car2:0, other:0 },
      ins:{ med1:0, med2:0, lic:0, life2:0, life3:0, life4:0, car1:0, car2:0, twoWh:0, other:0 },
      hh:{ household:35000, edu1:0, edu2:0, travel:0, driver:0, other1:0, other2:0 },
      inc:{ salary:150000, rental:0, other:0 },
      increment:0
    },
    nw:{
      assets:[
        { n:'Primary residence', v:0, g:5 },
        { n:'Second property',   v:0, g:5 },
        { n:'Third property',    v:0, g:5 },
        { n:'Land parcel 1',     v:0, g:5 },

        { n:'Fixed deposits',    v:0, g:7 },

      ],
      liab:{ housing:0, personal:0, car:0, other:0 }
    },
    goals:{ edu1:2500000, edu2:0, mar1:1500000, mar2:0 },
    sip:{ amount:25000, stepMode:'percent', stepVal:10, rate:12, years:20 }
  };
}
var S = defaults();

/* ---------- Derived model ---------- */
function calc(){
  var b = S.basic, e = S.exp, o = {};

  // --- expense roll-ups ---
  o.loanTotal = Object.keys(e.loans).reduce(function(a,k){ return a + N(e.loans[k]); },0);
  o.insTotal  = Object.keys(e.ins).reduce(function(a,k){ return a + N(e.ins[k]); },0);
  o.hhTotal   = Object.keys(e.hh).reduce(function(a,k){ return a + N(e.hh[k]); },0);
  o.expTotal  = o.loanTotal + o.insTotal + o.hhTotal;
  o.incTotal  = Object.keys(e.inc).reduce(function(a,k){ return a + N(e.inc[k]); },0);
  o.netMonthly = o.incTotal - o.expTotal;
  o.disposable = o.netMonthly + N(e.increment);

  // Expenses that persist into retirement (insurance + household + travel + misc)
  o.retRelevant = o.insTotal + N(e.hh.household) + N(e.hh.travel) + N(e.hh.other1);

  // --- horizon ---
  o.yrsToRet = Math.max(0, N(b.retAge) - N(b.curAge));

  // --- net worth ---
  o.assets = S.nw.assets.map(function(a){
    return { n:a.n, v:N(a.v), g:N(a.g),
             fv: FV(N(a.g)/100, o.yrsToRet, 0, -N(a.v)) };
  });
  o.assetNow = o.assets.reduce(function(s,a){ return s+a.v; },0);
  o.assetFV  = o.assets.reduce(function(s,a){ return s+a.fv; },0);
  o.liabTotal = Object.keys(S.nw.liab).reduce(function(s,k){ return s+N(S.nw.liab[k]); },0);
  o.netWorth  = o.assetNow - o.liabTotal;

  // liquid = shares&MF (5) + FD (6) + bullion (8)
  o.liquidNow = o.assets[5].v + o.assets[6].v + o.assets[8].v;
  o.liquidFV  = o.assets[5].fv + o.assets[6].fv + o.assets[8].fv;
  // property estate = first three
  o.propNow = o.assets[0].v + o.assets[1].v + o.assets[2].v;
  o.propFV  = o.assets[0].fv + o.assets[1].fv + o.assets[2].fv;

  // --- retirement ---
  o.firstPension = FV(N(b.inflNow)/100, o.yrsToRet, 0, -o.retRelevant);
  o.realRate = (1 + N(b.retRet)/100) / (1 + N(b.inflRet)/100) - 1;
  o.corpus = PV(o.realRate/12, N(b.retLife)*12, -o.firstPension, 0, 0);
  o.corpusGap = o.corpus - o.liquidFV;
  o.retMonthly = o.corpusGap > 0
    ? PMT(N(b.retNow)/100/12, o.yrsToRet*12, 0, -o.corpusGap, 0) : 0;

  // --- goal engine (education / marriage) ---
  function goal(childAge, targetAge, presentCost){
    var yrs = Math.max(0, N(targetAge) - N(childAge));
    var cost = N(presentCost);
    if(cost <= 0 || yrs <= 0) return { yrs:yrs, future:0, monthly:0, present:cost };
    var fut = FV(N(b.inflNow)/100, yrs, 0, -cost);
    var mo  = PMT(N(b.retNow)/100/12, yrs*12, 0, -fut, 0);
    return { yrs:yrs, future:fut, monthly:mo, present:cost };
  }
  o.edu1 = goal(b.c1Age, b.c1Edu, S.goals.edu1);
  o.edu2 = goal(b.c2Age, b.c2Edu, S.goals.edu2);
  o.mar1 = goal(b.c1Age, b.c1Mar, S.goals.mar1);
  o.mar2 = goal(b.c2Age, b.c2Mar, S.goals.mar2);

  // --- estate ---
  var estGrowth = o.assets[0].g / 100;
  o.estAtRet = o.propFV;
  o.estAtEol = FV(estGrowth, N(b.retLife), 0, -o.estAtRet);
  o.estPlanned = N(b.estate);
  o.estExcess = o.estPlanned - o.estAtEol;
  o.estAssetNeeded = o.estExcess > 0
    ? PV(estGrowth/12, N(b.retLife)*12, 0, -o.estExcess, 0) : 0;
  o.estMonthly = o.estAssetNeeded > 0
    ? PMT(N(b.retNow)/100/12, o.yrsToRet*12, 0, -o.estAssetNeeded, 0) : 0;

  // --- totals ---
  o.savingsNeeded = o.retMonthly + o.edu1.monthly + o.edu2.monthly
                  + o.mar1.monthly + o.mar2.monthly + o.estMonthly;
  o.surplus = o.disposable - o.savingsNeeded;
  o.commitTotal = o.expTotal + o.savingsNeeded;
  o.commitGap = o.incTotal + N(e.increment) - o.commitTotal;

  // --- SIP projection ---
  o.sip = sipProject();
  return o;
}

function sipProject(){
  var p = S.sip,
      months = Math.max(0, Math.round(N(p.years)*12)),
      r = N(p.rate)/100/12,
      mo = N(p.amount),
      bal = 0, invested = 0, rows = [], yearInv = 0;
  for(var m = 1; m <= months; m++){
    bal = bal*(1+r) + mo;
    invested += mo; yearInv += mo;
    if(m % 12 === 0){
      rows.push({ year:m/12, monthly:mo, investedYear:yearInv,
                  investedCum:invested, value:bal, gain:bal-invested });
      yearInv = 0;
      if(p.stepMode === 'percent')      mo = mo * (1 + N(p.stepVal)/100);
      else if(p.stepMode === 'amount')  mo = mo + N(p.stepVal);
    }
  }
  return { rows:rows, invested:invested, value:bal, gain:bal-invested,
           finalMonthly:mo, months:months };
}

<script>
/* =====================================================================

   ===================================================================== */
(function(){
'use strict';
var A = window.APP;
var money=A.money, compact=A.compact, inr=A.inr, N=A.N;
var S = A.getState();
var D = null;                       // latest derived model
var active = 'overview';
var LOGO_W = window.LOGO_WHITE_FULL || window.LOGO_WHITE, LOGO_C = window.LOGO_COLOR;

/* ---------- typing buffer ----------
   While a field has focus we keep the EXACT string the user typed. A re-render
   re-uses that raw string instead of the parsed number, so partial input like
   "10." or "-" is never rewritten mid-keystroke and the caret never jumps. */
var typing = { path:null, raw:'', selStart:null, selEnd:null };

/* ---------- tiny DOM helper ---------- */
function el(tag, attrs, html){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'class') n.className = attrs[k];
    else if(k === 'html') n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if(html != null) n.innerHTML = html;
  return n;
}
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* ---------- toast ---------- */
var toastT;
function toast(msg, kind){
  var t = $('#toast');
  t.className = 'toast show' + (kind ? ' '+kind : '');
  t.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.className = 'toast'; }, 3200);
}

/* ---------- persistence ---------- */
var KEY = 'aicoach.finplan.v1';
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(o && typeof o === 'object'){
      // shallow-merge so new fields in future versions still get defaults
      var base = A.defaults();
      ['meta','basic','goals','sip'].forEach(function(k){
        if(o[k]) base[k] = Object.assign(base[k], o[k]);
      });
      if(o.exp) ['loans','ins','hh','inc'].forEach(function(k){
        if(o.exp[k]) base.exp[k] = Object.assign(base.exp[k], o.exp[k]);
      });
      if(o.exp && o.exp.increment != null) base.exp.increment = o.exp.increment;
      if(o.nw){
        if(Array.isArray(o.nw.assets) && o.nw.assets.length === base.nw.assets.length) base.nw.assets = o.nw.assets;
        if(o.nw.liab) base.nw.liab = Object.assign(base.nw.liab, o.nw.liab);
      }
      S = base; A.setState(S);
    }
  }catch(e){}
}

/* ---------- state path get/set ---------- */
function getP(path){
  return path.split('.').reduce(function(o,k){
    if(o == null) return undefined;
    var m = k.match(/^(\w+)\[(\d+)\]$/);
    return m ? (o[m[1]] || [])[+m[2]] : o[k];
  }, S);
}
function setP(path, val){
  var parts = path.split('.'), last = parts.pop();
  var tgt = parts.reduce(function(o,k){
    var m = k.match(/^(\w+)\[(\d+)\]$/);
    return m ? o[m[1]][+m[2]] : o[k];
  }, S);
  if(tgt) tgt[last] = val;
}

/* ---------- field builders ---------- */
function fld(opt){
  // opt: {path,label,hint,pre,suf,type,min,max,step,slider,options}
  var wrap = el('div', {class:'f'});
  var lab = el('label', null, opt.label);
  wrap.appendChild(lab);
  var box = el('div', {class:'inp'});
  if(opt.pre) box.appendChild(el('span',{class:'pre'}, opt.pre));
  var input;
  if(opt.options){
    input = el('select');
    opt.options.forEach(function(o){
      var op = el('option', {value:o.v}, o.l);
      input.appendChild(op);
    });
    input.value = getP(opt.path);
  } else {
    // type=text (not number) so selectionStart/setSelectionRange work in every browser —
    // that is what makes caret restoration reliable and stops digits reversing.
    input = el('input', {type:'text', inputmode:'decimal', autocomplete:'off', spellcheck:'false'});
    if(opt.min != null) input.setAttribute('data-min', opt.min);
    if(opt.max != null) input.setAttribute('data-max', opt.max);
    if(typing.path === opt.path){
      input.value = typing.raw;                 // keep exactly what is being typed
    } else {
      var v = getP(opt.path);
      input.value = (v === 0 || v) ? v : '';
    }
  }
  input.setAttribute('data-path', opt.path);
  input.setAttribute('aria-label', opt.label);
  box.appendChild(input);
  if(opt.suf) box.appendChild(el('span',{class:'suf'}, opt.suf));
  wrap.appendChild(box);

  if(opt.slider){
    var srow = el('div', {class:'sld'});
    var rng = el('input', {type:'range', min:opt.min, max:opt.max, step:opt.step||1});
    rng.value = N(getP(opt.path));
    rng.setAttribute('data-path', opt.path);
    rng.setAttribute('data-sync','1');
    rng.setAttribute('aria-label', opt.label + ' slider');
    setPct(rng);
    srow.appendChild(rng);
    wrap.appendChild(srow);
  }
  if(opt.hint) wrap.appendChild(el('div', {class:'hint'}, opt.hint));
  return wrap;
}
function setPct(rng){
  var min = +rng.min, max = +rng.max, v = +rng.value;
  var p = max > min ? ((v-min)/(max-min))*100 : 0;
  rng.style.setProperty('--pct', Math.max(0,Math.min(100,p)) + '%');
}
function ro(label, value, hint){     // read-only computed field
  var wrap = el('div', {class:'f'});
  wrap.appendChild(el('label', null, label + ' <span class="pill pill-ca">auto</span>'));
  var box = el('div', {class:'inp ro'});
  var i = el('input', {type:'text', readonly:'readonly', tabindex:'-1'});
  i.value = value;
  box.appendChild(i);
  wrap.appendChild(box);
  if(hint) wrap.appendChild(el('div',{class:'hint'}, hint));
  return wrap;
}
function met(k, v, note, cls){
  return '<div class="met '+(cls||'')+'"><div class="k">'+k+'</div>'
       + '<div class="v">'+v+'</div>'
       + (note ? '<div class="n">'+note+'</div>' : '') + '</div>';
}
function card(title, sub, bodyNode, tight){
  var c = el('div', {class:'card'});
  var h = el('div', {class:'card-h'});
  h.appendChild(el('div', null, '<h2>'+title+'</h2>' + (sub ? '<div class="sub">'+sub+'</div>' : '')));
  c.appendChild(h);
  var b = el('div', {class:'card-b' + (tight ? ' tight' : '')});
  if(typeof bodyNode === 'string') b.innerHTML = bodyNode; else b.appendChild(bodyNode);
  c.appendChild(b);
  return c;
}
function grid(cols, nodes){
  var g = el('div', {class:'grid g'+cols});
  nodes.forEach(function(n){ if(n) g.appendChild(n); });
  return g;
}

/* ---------- charts (hand-rolled SVG, no dependencies) ---------- */
function donut(segs, opts){
  opts = opts || {};
  var size = opts.size || 230, sw = opts.stroke || 30, r = (size-sw)/2, c = size/2;
  var circ = 2*Math.PI*r;
  var total = segs.reduce(function(s,x){ return s + Math.max(0,x.v); }, 0);
  var out = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="'+(opts.aria||'chart')+'">';
  out += '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#EDF1F6" stroke-width="'+sw+'"/>';
  if(total > 0){
    var off = 0;
    segs.forEach(function(s){
      var frac = Math.max(0,s.v)/total, len = frac*circ;
      if(len <= 0) return;
      out += '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="'+sw
           + '" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-off)
           + '" transform="rotate(-90 '+c+' '+c+')" stroke-linecap="butt"><title>'+s.l+'</title></circle>';
      off += len;
    });
  }
  if(opts.center){
    out += '<text x="'+c+'" y="'+(c-4)+'" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="21" font-weight="600" fill="#0A1725">'+opts.center+'</text>';
    if(opts.centerSub)
      out += '<text x="'+c+'" y="'+(c+16)+'" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#657789">'+opts.centerSub+'</text>';
  }
  return out + '</svg>';
}
function legend(segs, total){
  return '<div class="legend">' + segs.map(function(s){
    var pc = total > 0 ? Math.round(s.v/total*1000)/10 : 0;
    return '<div class="lg"><span class="sw" style="background:'+s.c+'"></span>'
         + '<span class="lb">'+s.l+'</span>'
         + '<span class="vl">'+money(s.v)+'</span>'
         + '<span class="lb" style="flex:0 0 46px;text-align:right">'+pc+'%</span></div>';

// stacked area/bar growth chart for SIP
function growthChart(rows, opts){
  opts = opts || {};
  var w = 100, h = 42, pad = 0;               // viewBox units, scales responsively
  if(!rows.length) return '<div class="note">Enter a duration to see the projection.</div>';
  var maxV = Math.max.apply(null, rows.map(function(r){ return r.value; }));
  if(maxV <= 0) maxV = 1;
  var n = rows.length, bw = w/n, gap = Math.min(bw*0.22, 1.1);
  var bars = '', labels = '';
  rows.forEach(function(r, i){
    var x = i*bw + gap/2, bwid = bw-gap;
    var hv = (r.value/maxV)*h, hi = (r.investedCum/maxV)*h;
    bars += '<rect x="'+x.toFixed(2)+'" y="'+(h-hv).toFixed(2)+'" width="'+bwid.toFixed(2)+'" height="'+hv.toFixed(2)+'" fill="'+(opts.gainColor||'#17845B')+'" rx="0.4"><title>Year '+r.year+' — value '+money(r.value)+'</title></rect>';
    bars += '<rect x="'+x.toFixed(2)+'" y="'+(h-hi).toFixed(2)+'" width="'+bwid.toFixed(2)+'" height="'+hi.toFixed(2)+'" fill="'+(opts.investColor||'#1F4FA6')+'" rx="0.4"><title>Year '+r.year+' — invested '+money(r.investedCum)+'</title></rect>';
    var every = n > 24 ? 5 : (n > 12 ? 2 : 1);
    if(r.year % every === 0 || r.year === 1 || r.year === n)
      labels += '<text x="'+(x+bwid/2).toFixed(2)+'" y="'+(h+3.6)+'" text-anchor="middle" font-size="2.6" fill="#657789" font-family="Inter,sans-serif">'+r.year+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+(h+6)+'" width="100%" style="display:block" role="img" aria-label="Year by year growth">'
       + '<line x1="0" y1="'+h+'" x2="'+w+'" y2="'+h+'" stroke="#DFE5ED" stroke-width="0.3"/>'
       + bars + labels + '</svg>';
}

/* ---------- DOM morphing ----------
   Re-rendering by replacing innerHTML destroys the <input> the user is typing in, which
   is what made the caret jump to position 0 and reverse the digits. Instead we build the
   new page off-screen and patch the differences into the live DOM, never touching a
   focused control. The element the user is typing in is literally never recreated. */
function sameNode(a, b){
  if(a.nodeType !== b.nodeType) return false;
  if(a.nodeType === 1) return a.nodeName === b.nodeName &&
      (a.getAttribute('data-path') || '') === (b.getAttribute('data-path') || '');
  return true;
}
function syncAttrs(oldEl, newEl, isControl){
  var i, a;
  for(i = newEl.attributes.length - 1; i >= 0; i--){
    a = newEl.attributes[i];
    if(isControl && (a.name === 'value' || a.name === 'checked')) continue;
    if(oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value);
  }
  for(i = oldEl.attributes.length - 1; i >= 0; i--){
    a = oldEl.attributes[i];
    if(isControl && (a.name === 'value' || a.name === 'checked')) continue;
    if(!newEl.hasAttribute(a.name)) oldEl.removeAttribute(a.name);
  }
}
function morph(oldNode, newNode){
  if(!sameNode(oldNode, newNode)){
    oldNode.parentNode.replaceChild(newNode, oldNode);
    return;
  }
  if(oldNode.nodeType === 3 || oldNode.nodeType === 8){
    if(oldNode.nodeValue !== newNode.nodeValue) oldNode.nodeValue = newNode.nodeValue;
    return;
  }
  if(oldNode.nodeType !== 1) return;

  var tag = oldNode.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA'){
    syncAttrs(oldNode, newNode, true);
    // Never rewrite the control the user is interacting with.
    if(document.activeElement !== oldNode){
      if(oldNode.type === 'range'){
        if(oldNode.value !== newNode.value){ oldNode.value = newNode.value; setPct(oldNode); }
      } else if(tag === 'SELECT'){
        if(oldNode.value !== newNode.value) oldNode.value = newNode.value;
      } else if(oldNode.value !== newNode.value){
        oldNode.value = newNode.value;
      }
    } else if(oldNode.type === 'range'){
      setPct(oldNode);
    }
    return;
  }
  syncAttrs(oldNode, newNode, false);

  var oldKids = [], newKids = [], n;
  for(n = oldNode.firstChild; n; n = n.nextSibling) oldKids.push(n);
  for(n = newNode.firstChild; n; n = n.nextSibling) newKids.push(n);
  var max = Math.max(oldKids.length, newKids.length);
  for(var i = 0; i < max; i++){
    if(i >= newKids.length){ oldNode.removeChild(oldKids[i]); continue; }
    if(i >= oldKids.length){ oldNode.appendChild(newKids[i]); continue; }
    morph(oldKids[i], newKids[i]);
  }
}

function renderBody(id, forceFull){
  var host = $('[data-body="'+id+'"]');
  if(!host || !PAGES[id]) return;
  var fresh = PAGES[id]();
  if(forceFull || !host.firstChild){
    host.innerHTML = '';
    host.appendChild(fresh);
  } else {
    // patch in place so focused inputs survive untouched
    var shadow = document.createElement('div');
    shadow.appendChild(fresh);
    try{
      morph(host, shadow);
      host.className = 'wrap';
      host.setAttribute('data-body', id);
    }catch(err){
      host.innerHTML = '';
      host.appendChild(PAGES[id]());
    }
  }
  var meta = $('[data-meta="'+id+'"]');
  if(meta){
    var nm = S.meta.name || 'Unnamed plan';
    meta.innerHTML = '<span class="chip">'+nm+'</span>'
      + '<span class="chip">Age <b>'+inr(N(S.basic.curAge))+'</b> \u2192 <b>'+inr(N(S.basic.retAge))+'</b></span>'

  renderBody(id, true);
  closeNav();
  window.scrollTo({top:0, behavior:'auto'});
  // Deep-link the URL, but never let it break the app. In a sandboxed srcdoc iframe
  // (and under some file:// setups) replaceState throws a SecurityError; navigation
  // itself does not depend on it, so failing here is harmless and must stay silent.
  try{
    if(window.history && history.replaceState) history.replaceState(null, '', '#' + id);
  }catch(err){ /* history not available in this embedding context */ }
}

/* ---------- events (delegated — survives re-render) ---------- */
function onInput(e){
  var t = e.target;
  var path = t.getAttribute && t.getAttribute('data-path');
  if(!path) return;
  if(t.tagName === 'SELECT') return;   // handled synchronously by the change listener below

  var isRange = t.type === 'range';
  var isStr = !!t.getAttribute('data-str');
  var val;
  if(isStr){
    val = t.value;
  } else {
    // remember the raw keystrokes for this field while it is focused
    if(!isRange){
      typing.path = path;
      typing.raw = t.value;
      try{ typing.selStart = t.selectionStart; typing.selEnd = t.selectionEnd; }catch(err){}
    }
    var cleaned = String(t.value).replace(/[^0-9.\-]/g, '');
    val = cleaned === '' || cleaned === '-' || cleaned === '.' ? 0 : parseFloat(cleaned);
    if(!isFinite(val)) val = 0;
  }
  setP(path, val);
  if(isRange){
    setPct(t);
    typing.path = null;              // slider drags never need a text buffer
  }

  // live-sync partner control (slider <-> number) without a full re-render
  $$('[data-path="'+path.replace(/"/g,'\\"')+'"]').forEach(function(o){
    if(o !== t && document.activeElement !== o){
      if(o.type === 'range'){ o.value = val; setPct(o); }
      else if(!isStr){ o.value = val; }
    }
  });
  save();
  scheduleRefresh(t);
}
// Re-render is debounced and preserves focus + caret so typing is never interrupted.
var rT = null;
function scheduleRefresh(){
  // With morphing, the focused control is never rebuilt, so there is no focus or caret
  // to restore — we just recompute and patch the surrounding values.
  clearTimeout(rT);
  rT = setTimeout(refresh, 90);
}
document.addEventListener('input', onInput);
document.addEventListener('focusout', function(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;
  var path = t.getAttribute('data-path');
  if(path && path === typing.path){
    typing.path = null; typing.raw = ''; typing.selStart = null; typing.selEnd = null;
    // Defer one tick and check where focus actually landed. If the user simply moved to
    // another field, DO NOT re-render — doing so would destroy the element they just
    // clicked into and throw away their focus and caret.
    setTimeout(function(){
      var ae = document.activeElement;
      if(ae && ae.getAttribute && ae.getAttribute('data-path')) return;
      clearTimeout(rT); refresh();        // left the form entirely: normalise the display
    }, 0);
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.tagName === 'SELECT' && t.getAttribute('data-path')){
    // A select can change which fields exist (e.g. SIP step-up mode), so re-render
    // immediately instead of waiting for the debounce.
    var path = t.getAttribute('data-path');
    setP(path, t.value);
    save();
    clearTimeout(rT);
    refresh();
    var again = document.querySelector('[data-path="' + path.replace(/"/g,'\\"') + '"]');
    if(again && again.tagName === 'SELECT') again.focus({preventScroll:true});
  }
});
document.addEventListener('click', function(e){
  var nv = e.target.closest ? e.target.closest('[data-nav]') : null;
  if(nv){ go(nv.getAttribute('data-nav')); return; }
  var g = e.target.closest ? e.target.closest('[data-go]') : null;
  if(g){ go(g.getAttribute('data-go')); return; }
});
$('#burger').addEventListener('click', openNav);
$('#scrim').addEventListener('click', closeNav);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeNav(); });

  S = A.defaults(); A.setState(S);

  refresh(); toast('Plan reset to defaults', 'ok');
});

try{ hash = (location.hash || '').replace('#',''); }catch(err){ hash = ''; }

window.__toast = toast;
})();

<script>
/* =====================================================================
   EXPORT LAYER — Excel (.xlsx) and PDF
   ===================================================================== */
(function(){
'use strict';
var A = window.APP;
var inr = A.inr, N = A.N;
// The rupee sign U+20B9 does not exist in jsPDF's standard WinAnsi font encoding — it
// renders as a stray superscript glyph. Everything drawn into the PDF uses "Rs" instead.
function money(n){ return 'Rs ' + inr(n); }
function pcompact(n){
  if(!isFinite(n)) return 'Rs 0';
  var neg=n<0, a=Math.abs(n), s;
  if(a>=1e7) s=(a/1e7).toFixed(2).replace(/\.00$/,'')+' Cr';
  else if(a>=1e5) s=(a/1e5).toFixed(2).replace(/\.00$/,'')+' L';
  else if(a>=1e3) s=(a/1e3).toFixed(1).replace(/\.0$/,'')+' K';
  else s=String(Math.round(a));
  return (neg?'-':'')+'Rs '+s;
}
// Render an inline SVG string to a PNG data URL so charts can be embedded in the PDF.
function svgToPng(svg, w, h){
  return new Promise(function(resolve){
    // Never let a chart hold up the export: if the image cannot be rasterised for any
    // reason, resolve null after a short timeout and the PDF is built without it.
    var done = false;
    function finish(v){ if(!done){ done = true; resolve(v); } }
    setTimeout(function(){ finish(null); }, 1200);
    try{
      var src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
      var img = new Image();
      img.onload = function(){
        try{
          var cv = document.createElement('canvas');
          cv.width = w*2; cv.height = h*2;
          var cx = cv.getContext('2d');
          cx.fillStyle = '#FFFFFF'; cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          finish(cv.toDataURL('image/png'));
        }catch(e){ finish(null); }
      };
      img.onerror = function(){ finish(null); };
      img.src = src;
    }catch(e){ finish(null); }
  });
}
// Standalone donut builder for PDF embedding (mirrors the on-screen chart).
function pdfDonut(segs, size){
  size = size || 300;
  var sw = 42, r = (size-sw)/2, c = size/2, circ = 2*Math.PI*r;
  var total = segs.reduce(function(s,x){ return s + Math.max(0,x.v); }, 0);
  var o = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">';
  o += '<rect width="'+size+'" height="'+size+'" fill="#FFFFFF"/>';
  o += '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#EDF1F6" stroke-width="'+sw+'"/>';
  var off = 0;
  if(total>0) segs.forEach(function(s){
    var len = Math.max(0,s.v)/total*circ;
    if(len<=0) return;
    o += '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="'+sw
       + '" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-off)
       + '" transform="rotate(-90 '+c+' '+c+')"/>';
    off += len;
  });
  return o + '</svg>';
}
// Horizontal bar comparison for the PDF.
function pdfBars(items, w, h){
  w = w||620; h = h||Math.max(60, items.length*34+16);
  var max = Math.max.apply(null, items.map(function(i){ return Math.abs(i.v); }).concat([1]));
  var o = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">';
  o += '<rect width="'+w+'" height="'+h+'" fill="#FFFFFF"/>';
  var labW = 190, barMax = w - labW - 150;
  items.forEach(function(it,i){
    var y = 10 + i*34, bw = Math.max(2, Math.abs(it.v)/max*barMax);
    o += '<text x="0" y="'+(y+15)+'" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#33475B">'+
         String(it.l).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text>';
    o += '<rect x="'+labW+'" y="'+y+'" width="'+barMax+'" height="20" fill="#F1F4F8" rx="3"/>';
    o += '<rect x="'+labW+'" y="'+y+'" width="'+bw+'" height="20" fill="'+it.c+'" rx="3"/>';
    o += '<text x="'+(labW+barMax+10)+'" y="'+(y+15)+'" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#132434">Rs '+A.inr(it.v)+'</text>';
  });
  return o + '</svg>';

/* ---------- EXCEL ---------- */
function exportXlsx(){
  if(typeof XLSX === 'undefined'){
    toast('Spreadsheet library did not load — check your connection and reload.', 'err');
    return;
  }
  try{
    var T = tables(), wb = XLSX.utils.book_new();
    var MFMT = '\u20B9#,##,##0;[Red]-\u20B9#,##,##0';
    var PFMT = '0.0%';

    T.forEach(function(tb){
      var aoa = [], meta = [];
      aoa.push([tb.title]);
      aoa.push(['121 AI Coach — Wealth Made Easy'
        + (S().meta.name ? '   |   ' + S().meta.name : '')
        + (S().meta.date ? '   |   ' + S().meta.date : '')]);
      aoa.push([]);
      aoa.push(tb.cols.slice());
      tb.rows.forEach(function(r){
        var kind = r[r.length-1];
        if(kind === 'gap'){ aoa.push([]); meta.push(null); return; }
        if(tb.six){
          aoa.push([r[0], r[1], r[2], r[3], r[4], r[5]]);
          meta.push({ money:[1,2,3,4,5] });
        } else if(tb.four){
          aoa.push([r[0], r[1] === '' ? null : r[1], r[2] === '' ? null : r[2], r[3] === '' ? null : r[3]]);
          meta.push({ money:[1,3], pct:[2] });
        } else {
          var v = r[1];
          aoa.push([r[0], v === '' ? null : v]);
          meta.push({ money: (kind==='money'||kind==='total') ? [1] : [], pct: kind==='pct' ? [1] : [] });
        }
      });

      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = tb.w.map(function(w){ return {wch:w}; });
      ws['!merges'] = [
        {s:{r:0,c:0}, e:{r:0, c:tb.cols.length-1}},
        {s:{r:1,c:0}, e:{r:1, c:tb.cols.length-1}}
      ];
      // apply number formats
      var startRow = 4;
      meta.forEach(function(m, i){
        if(!m) return;
        var R = startRow + i;
        (m.money||[]).forEach(function(C){
          var ad = XLSX.utils.encode_cell({r:R, c:C});
          if(ws[ad] && typeof ws[ad].v === 'number') ws[ad].z = MFMT;
        });
        (m.pct||[]).forEach(function(C){
          var ad = XLSX.utils.encode_cell({r:R, c:C});
          if(ws[ad] && typeof ws[ad].v === 'number') ws[ad].z = PFMT;
        });
      });
      XLSX.utils.book_append_sheet(wb, ws, tb.name.slice(0,31));
    });

    XLSX.writeFile(wb, stamp() + '.xlsx');
    toast('Excel workbook downloaded', 'ok');
  }catch(err){
    console.error(err);
    toast('Could not build the Excel file: ' + (err && err.message ? err.message : 'unknown error'), 'err');
  }
}

      tb.rows.forEach(function(r){
        var kind = r[r.length-1];
        if(kind === 'gap'){ body.push([{content:'', colSpan:tb.cols.length, styles:{minCellHeight:5, fillColor:[255,255,255]}}]); return; }
        var idx = body.length;
        if(tb.six){
          body.push([r[0], money(r[1]), money(r[2]), money(r[3]), money(r[4]), money(r[5])]);
        } else if(tb.four){
          body.push([ r[0],
                      r[1] === '' ? '' : money(r[1]),
                      r[2] === '' ? '' : A.pctS(N(r[2])*100),
                      r[3] === '' ? '' : money(r[3]) ]);
          if(kind === 'head4') styleMap[idx] = 'head';
          if(kind === 'total4') styleMap[idx] = 'total';
        } else {
          var v = r[1], txt;
          if(kind === 'money' || kind === 'total') txt = money(v);
          else if(kind === 'pct') txt = A.pctS(N(v)*100);
          else if(kind === 'num') txt = inr(N(v));
          else txt = String(v);
          if(kind === 'head'){ body.push([{content:r[0], colSpan:2, styles:{fontStyle:'bold'}}]); styleMap[idx]='head'; }
          else body.push([r[0], txt]);
          if(kind === 'total') styleMap[idx] = 'total';
        }
      });

      doc.autoTable({
        head:[tb.cols],
        body: body,
        startY: HDR_H + 26,
        margin: { left:36, right:36, top:HDR_H + 26, bottom:54 },
        theme:'grid',
        styles:{ font:'helvetica', fontSize:9, cellPadding:{top:5,right:7,bottom:5,left:7},
                 lineColor:LINE, lineWidth:.4, textColor:INK, overflow:'linebreak' },
        headStyles:{ fillColor:NAVY, textColor:[255,255,255], fontStyle:'bold', fontSize:8,
                     cellPadding:{top:6,right:7,bottom:6,left:7} },
        alternateRowStyles:{ fillColor:[249,251,253] },
        columnStyles: (function(){
          var cs = {};
          for(var i=1;i<tb.cols.length;i++) cs[i] = { halign:'right', cellWidth: tb.six ? 'auto' : 120 };
          cs[0] = { cellWidth:'auto' };
          return cs;
        })(),
        didParseCell: function(data){
          if(data.section !== 'body') return;
          var k = styleMap[data.row.index];
          if(k === 'head'){
            data.cell.styles.fillColor = [233,239,251];
            data.cell.styles.textColor = [20,58,124];
            data.cell.styles.fontStyle = 'bold';
            data.cell.styles.fontSize = 8.4;
          } else if(k === 'total'){
            data.cell.styles.fillColor = [240,244,249];
            data.cell.styles.fontStyle = 'bold';
          }
          var raw = data.cell.raw;
          if(typeof raw === 'string' && /^(-Rs|Rs\s*-)/.test(raw)) data.cell.styles.textColor = [192,57,43];
        },
        didDrawPage: function(){
          var p = doc.internal.getNumberOfPages();
          doc.setFontSize(7.6); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
          doc.setFont('helvetica','normal'); doc.setCharSpace(0);
          doc.text('121 AI Coach  \u2022  Wealth Made Easy', 36, PH-26);
          doc.text('Page ' + p, PW-36, PH-26, {align:'right'});
          doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(.4);
          doc.line(36, PH-38, PW-36, PH-38);
        }
      });
    });

    /* --- SIP visual page (only when a projection exists) --- */
    if(d.sip.rows.length){
      doc.addPage();
      drawHeader(doc, 'SIP Projection \u2014 Visual', s, PW, NAVY, GOLD);
      var sy = HDR_H + 22;
      var ssegs = [
        { l:'Amount invested', v:Math.max(0,d.sip.invested), c:'#0D6E68' },
        { l:'Growth earned',   v:Math.max(0,d.sip.gain),     c:'#C9A24B' }
      ];
      var sImg = await svgToPng(pdfDonut(ssegs, 300), 300, 300);
      if(sImg){ try{ doc.addImage(sImg,'PNG', 36, sy, 150, 150); }catch(e){} }
      var sly = sy + 26, stot = ssegs.reduce(function(a,x){ return a+x.v; },0);
      ssegs.forEach(function(sg){
        var rgb = hex2rgb(sg.c);
        doc.setFillColor(rgb[0],rgb[1],rgb[2]);
        doc.roundedRect(206, sly-7, 9, 9, 2, 2, 'F');
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(INK[0],INK[1],INK[2]);
        doc.text(sg.l, 222, sly);
        doc.setFont('helvetica','bold');
        doc.text(money(sg.v), PW-36, sly, {align:'right'});
        sly += 24;
      });
      doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(.5);
      doc.line(206, sly-9, PW-36, sly-9);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(INK[0],INK[1],INK[2]);
      doc.text('Maturity value', 222, sly+9);
      doc.text(money(d.sip.value), PW-36, sly+9, {align:'right'});

      var gy = sy + 176;
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('Corpus growth year by year', 36, gy);
      var bars = d.sip.rows.map(function(r){
        return { l:'Year '+r.year, v:r.value, c:'#0D6E68' };
      });
      var step = bars.length > 12 ? Math.ceil(bars.length/12) : 1;
      bars = bars.filter(function(_,i){ return i % step === 0 || i === bars.length-1; });
      var gImg = await svgToPng(pdfBars(bars, 620, bars.length*34+16), 620, bars.length*34+16);
      if(gImg){
        var ghh = (bars.length*34+16) * (523/620);
        var avail = PH - gy - 70;
        if(ghh > avail) ghh = avail;
        try{ doc.addImage(gImg,'PNG', 36, gy+10, 523, ghh); }catch(e){}
      }
      doc.setFontSize(7.6); doc.setTextColor(MUT[0],MUT[1],MUT[2]); doc.setFont('helvetica','normal');
      doc.text('121 AI Coach  \u2022  Wealth Made Easy', 36, PH-26);
      doc.text('Page ' + doc.internal.getNumberOfPages(), PW-36, PH-26, {align:'right'});
    }

    // assumptions / disclaimer page
    doc.addPage();
    drawHeader(doc, 'Assumptions & Notes', s, PW, NAVY, GOLD);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(INK[0],INK[1],INK[2]);
    var notes = [
      'Provident fund and pension scheme balances are not included in this plan.',
      'Large unforeseen expenses are not budgeted; treat rental income and any pension corpus as the buffer.',
      'During retirement, returns and inflation are assumed to broadly offset, so the corpus preserves purchasing power rather than growing.',
      'Different assets are grown at their own rate up to the retirement date.',
      'Gold jewellery is excluded from assets; bullion may be included.',
      'All liabilities are assumed to be cleared by the retirement date.',
      'Rental income from property is deliberately excluded from retirement income.',
      'Figures are projections based on the rates you entered. Actual returns will vary.'
    ];
    var y = HDR_H + 26;
    notes.forEach(function(n,i){
      var lines = doc.splitTextToSize((i+1) + '.  ' + n, PW-96);
      doc.text(lines, 42, y);
      y += lines.length*13 + 7;
    });
    y += 12;
    doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(42, y, PW-42, y); y += 20;
    doc.setFontSize(8.6); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    var disc = doc.splitTextToSize(
      'This document is generated for planning and educational purposes by 121 AI Coach. It is not investment, tax or legal advice, '
      + 'and it does not account for your full personal circumstances. Please consult a qualified financial adviser before acting on it.', PW-96);
    doc.text(disc, 42, y);
    doc.setFontSize(7.6);
    doc.text('121 AI Coach  \u2022  Wealth Made Easy', 36, PH-26);
    doc.text('Page ' + doc.internal.getNumberOfPages(), PW-36, PH-26, {align:'right'});

    doc.save(stamp() + '.pdf');
    toast('PDF downloaded', 'ok');
  }catch(err){
    console.error(err);
    toast('Could not build the PDF: ' + (err && err.message ? err.message : 'unknown error'), 'err');
  }
}

document.getElementById('btnXlsx').addEventListener('click', exportXlsx);
document.getElementById('btnPdf').addEventListener('click', function(){
  var b = document.getElementById('btnPdf');
  b.disabled = true; var old = b.textContent; b.textContent = 'Building PDF\u2026';
  Promise.resolve(exportPdf()).catch(function(e){
    console.error(e);
    window.__pdfError = (e && e.stack) ? e.stack : String(e);
    toast('Could not build the PDF: ' + (e && e.message ? e.message : 'error'), 'err');
  }).then(function(){ b.disabled = false; b.textContent = old; });
});
window.__exportXlsx = exportXlsx;
window.__exportPdf = exportPdf;
window.__tables = tables;
})();

</script>
</body>
